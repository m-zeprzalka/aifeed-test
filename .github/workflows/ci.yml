# CI: typecheck + lint + testy na każdy push i PR (ROADMAP backlog 5.10).
# `next build` celowo poza CI — generateStaticParams i prerender czytają
# produkcyjną bazę (wymagałoby sekretów Supabase w GitHub). Pełna bramka
# przed deployem zostaje lokalnie: `npm run check && npm run build`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
